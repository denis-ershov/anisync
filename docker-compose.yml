# AniSync — Docker Compose для Coolify
#
# web / worker / scheduler. Postgres и Redis — внешние Coolify Database
# (Connect To Predefined Network), только DATABASE_URL и REDIS_URL.
#
# Домен вешается на сервис `web` (порт контейнера 3000).
# Health checks — в compose (Coolify / Traefik читают Docker health status).
# Без tsx: Docker HEALTHCHECK CMD часто не резолвит --import tsx → unhealthy → compose up падает.

x-healthcheck-web: &healthcheck-web
  test:
    [
      'CMD-SHELL',
      'node -e "fetch(\"http://127.0.0.1:\"+(process.env.PORT||3000)+\"/api/health\").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
    ]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 180s

x-healthcheck-queue: &healthcheck-queue
  test:
    [
      'CMD-SHELL',
      'node -e "const u=new URL(process.env.REDIS_URL||\"\");const n=require(\"net\");const s=n.connect({host:u.hostname,port:Number(u.port||6379)},()=>{s.end();process.exit(0)});s.on(\"error\",()=>process.exit(1));setTimeout(()=>process.exit(1),5000)"',
    ]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 45s

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_RELEASES_MODULE_ENABLED: ${NEXT_PUBLIC_RELEASES_MODULE_ENABLED:-true}
        NEXT_PUBLIC_TORRENTS_MODULE_ENABLED: ${NEXT_PUBLIC_TORRENTS_MODULE_ENABLED:-true}
        NEXT_PUBLIC_REGISTRATION_OPEN: ${NEXT_PUBLIC_REGISTRATION_OPEN:-true}
    restart: unless-stopped
    ports:
      - '3000'
    environment:
      NODE_ENV: production
      ANISYNC_PROCESS: web
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      APP_BASE_URL: ${APP_BASE_URL}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-anisync}
      JWT_SECRET: ${JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEBUG: ${DEBUG:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RELEASES_MODULE_ENABLED: ${RELEASES_MODULE_ENABLED:-true}
      TORRENTS_MODULE_ENABLED: ${TORRENTS_MODULE_ENABLED:-true}
      NEXT_PUBLIC_RELEASES_MODULE_ENABLED: ${NEXT_PUBLIC_RELEASES_MODULE_ENABLED:-true}
      NEXT_PUBLIC_TORRENTS_MODULE_ENABLED: ${NEXT_PUBLIC_TORRENTS_MODULE_ENABLED:-true}
      NEXT_PUBLIC_REGISTRATION_OPEN: ${NEXT_PUBLIC_REGISTRATION_OPEN:-true}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_PUBLIC_URL: ${PROWLARR_PUBLIC_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SHIKIMORI_BASE_URL: ${SHIKIMORI_BASE_URL:-https://shikimori.one}
      SHIKIMORI_CLIENT_ID: ${SHIKIMORI_CLIENT_ID:-}
      SHIKIMORI_CLIENT_SECRET: ${SHIKIMORI_CLIENT_SECRET:-}
      MYANIMELIST_CLIENT_ID: ${MYANIMELIST_CLIENT_ID:-}
      MYANIMELIST_CLIENT_SECRET: ${MYANIMELIST_CLIENT_SECRET:-}
      ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
      ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    healthcheck: *healthcheck-web

  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_RELEASES_MODULE_ENABLED: ${NEXT_PUBLIC_RELEASES_MODULE_ENABLED:-true}
        NEXT_PUBLIC_TORRENTS_MODULE_ENABLED: ${NEXT_PUBLIC_TORRENTS_MODULE_ENABLED:-true}
        NEXT_PUBLIC_REGISTRATION_OPEN: ${NEXT_PUBLIC_REGISTRATION_OPEN:-true}
    restart: unless-stopped
    command: ['node', '--import', 'tsx', 'scripts/worker.ts']
    environment:
      NODE_ENV: production
      ANISYNC_PROCESS: worker
      RUN_MIGRATIONS: 'false'
      APP_BASE_URL: ${APP_BASE_URL}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-anisync}
      JWT_SECRET: ${JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEBUG: ${DEBUG:-false}
      RELEASES_MODULE_ENABLED: ${RELEASES_MODULE_ENABLED:-true}
      TORRENTS_MODULE_ENABLED: ${TORRENTS_MODULE_ENABLED:-true}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_PUBLIC_URL: ${PROWLARR_PUBLIC_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SHIKIMORI_BASE_URL: ${SHIKIMORI_BASE_URL:-https://shikimori.one}
      SHIKIMORI_CLIENT_ID: ${SHIKIMORI_CLIENT_ID:-}
      SHIKIMORI_CLIENT_SECRET: ${SHIKIMORI_CLIENT_SECRET:-}
      MYANIMELIST_CLIENT_ID: ${MYANIMELIST_CLIENT_ID:-}
      MYANIMELIST_CLIENT_SECRET: ${MYANIMELIST_CLIENT_SECRET:-}
      ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
      ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
    healthcheck: *healthcheck-queue
    depends_on:
      web:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_RELEASES_MODULE_ENABLED: ${NEXT_PUBLIC_RELEASES_MODULE_ENABLED:-true}
        NEXT_PUBLIC_TORRENTS_MODULE_ENABLED: ${NEXT_PUBLIC_TORRENTS_MODULE_ENABLED:-true}
        NEXT_PUBLIC_REGISTRATION_OPEN: ${NEXT_PUBLIC_REGISTRATION_OPEN:-true}
    restart: unless-stopped
    command: ['node', '--import', 'tsx', 'scripts/scheduler.ts']
    environment:
      NODE_ENV: production
      ANISYNC_PROCESS: scheduler
      RUN_MIGRATIONS: 'false'
      APP_BASE_URL: ${APP_BASE_URL}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-anisync}
      JWT_SECRET: ${JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEBUG: ${DEBUG:-false}
      RELEASES_MODULE_ENABLED: ${RELEASES_MODULE_ENABLED:-true}
      TORRENTS_MODULE_ENABLED: ${TORRENTS_MODULE_ENABLED:-true}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_PUBLIC_URL: ${PROWLARR_PUBLIC_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    healthcheck: *healthcheck-queue
    depends_on:
      worker:
        condition: service_started
